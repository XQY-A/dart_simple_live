name: app-build-action-dev

on:
  workflow_dispatch:  
  push:
    tags:  
      - "dev_v*"

jobs:
  # 打包iOS、Mac
  build-mac-ios:  
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: dev

      # 设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      # 更新Flutter的packages
      - name:  Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 获取版本号
      - name: Get version
        id: version
        run: |
          cd simple_live_app
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # 安装appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run:  dart pub global activate flutter_distributor

      #打包iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      #创建未签名ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r SimpleLive_${{ steps.version.outputs.version }}_ios_no_sign.ipa Payload
          cd ../../..

      # 上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:  
          name: ios-${{ steps.version.outputs.version }}
          path: |
            simple_live_app/build/ios/iphoneos/*_ios_no_sign.ipa

      # 打包MAC
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 重命名MAC文件以包含版本号
      - name: Rename MacOS files
        run: |
          cd simple_live_app/build/dist
          for file in */*. dmg; do
            if [ -f "$file" ]; then
              dir=$(dirname "$file")
              newname="SimpleLive_${{ steps.version.outputs.version }}_macos. dmg"
              mv "$file" "$dir/$newname"
            fi
          done
          for file in */*.zip; do
            if [ -f "$file" ]; then
              dir=$(dirname "$file")
              basename=$(basename "$file" .zip)
              newname="SimpleLive_${{ steps. version.outputs.version }}_macos. zip"
              mv "$file" "$dir/$newname"
            fi
          done

      # 上传MAC至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: macos-${{ steps.version.outputs.version }}
          path: |
            simple_live_app/build/dist/*/*. dmg
            simple_live_app/build/dist/*/*.zip
      #完成
      - run: echo "🍏 This job's status is ${{ job. status }}."

  # 打包Windows
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses:  actions/checkout@v4
        with:
          ref: dev
      # 设置Flutter环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:  
          flutter-version: "3.38.x"
          cache: true
      - name:  Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name:  Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      
      # 获取版本号
      - name: Get version
        id: version
        shell: bash
        run: |
          cd simple_live_app
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      # 设置flutter_distributor环境
      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor
      # build Windows ZIP\MSIX
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean
      
      # 重命名Windows文件以包含版本号
      - name:  Rename Windows files
        shell: bash
        run: |
          cd simple_live_app/build/dist
          for file in */*. msix; do
            if [ -f "$file" ]; then
              dir=$(dirname "$file")
              newname="SimpleLive_${{ steps.version.outputs.version }}_windows.msix"
              mv "$file" "$dir/$newname"
            fi
          done
          for file in */*.zip; do
            if [ -f "$file" ]; then
              dir=$(dirname "$file")
              newname="SimpleLive_${{ steps.version.outputs.version }}_windows.zip"
              mv "$file" "$dir/$newname"
            fi
          done
      
      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.version.outputs.version }}
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
        #完成
      - run: echo "🍏 Windows job's status is ${{ job. status }}."
